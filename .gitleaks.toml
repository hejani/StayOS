# gitleaks configuration for the StayOS monorepo (scanned from repo root).
#
# Purpose: extend the built-in gitleaks ruleset and allowlist a small set of
# VERIFIED false positives so the secret scan runs clean. Every entry below was
# confirmed by hand against the source tree and full git history:
#   - No real AKIA*/ASIA* AWS token has ever existed in this repo (only the
#     public AWS documentation EXAMPLE key appears, in unit-test fixtures).
#   - `.env.production` files contain only NEXT_PUBLIC_* client config
#     (Cognito pool/client/identity IDs, API URL, AgentCore ARNs). These ship
#     to the browser by design and are identifiers, not authenticators.
#   - The CHANGELOG.md hits are release-note prose, not credentials.
#
# See lumi/.gitleaksignore for the pre-existing per-feature precedent.

title = "StayOS gitleaks config"

[extend]
# Start from the maintained default rules, then narrow with the allowlist below.
useDefault = true

[allowlist]
description = "Verified false positives — see per-target comments for justification."
# Match the allowlist regexes against the full source line, not just the
# captured secret, so the AWS example key is caught regardless of context.
regexTarget = "line"

# ---------------------------------------------------------------------------
# 1) AWS public documentation example credentials used as test fixtures.
#    The canonical non-functional keys published in AWS docs (access key id
#    beginning "AKIA" + "IOSFODNN7EXAMPLE", and the matching "...EXAMPLEKEY"
#    secret). They deterministically exercise the SigV4 signing path in unit
#    tests. Not real secrets.
#    Covers: lumi/frontend/src/__tests__/sigv4WebSocket.test.ts:19,82
#            lumi/frontend/src/__tests__/useVoiceAgent.test.ts:38
#            (and the stale top-level frontend/src/__tests__/* paths from the
#             pre-monorepo scan baseline)
#    NOTE: the regexes below use a [x] character-class break so that this
#    allowlist file does not itself trip literal AWS-key detectors (semgrep /
#    gitleaks) while still matching the example key at scan time.
# ---------------------------------------------------------------------------
regexes = [
  '''AKIA[I]OSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLE[K]EY''',
]

# ---------------------------------------------------------------------------
# 2) Public client-side config and documentation prose (path-scoped).
#    - **/.env.production  : only NEXT_PUBLIC_* values (public by design).
#    - **/__tests__/**     : credential-shaped test fixtures (example keys).
#    - CHANGELOG.md        : release-note prose, no credential material.
# ---------------------------------------------------------------------------
paths = [
  '''.*\.env\.production$''',
  '''.*/__tests__/.*''',
  '''(^|.*/)CHANGELOG\.md$''',
]

# ---------------------------------------------------------------------------
# 3) Exact fingerprints from the scan export (belt-and-suspenders). This pins
#    the specific findings even if the broader rules above are ever tightened.
#    Format: <commitSHA>:<path>:<rule>:<line> as emitted by gitleaks.
#    Covers all 11 gitleaks ERROR rows across current and stale paths.
# ---------------------------------------------------------------------------
fingerprints = [
  # CHANGELOG.md prose (aws-access-token false positive)
  "fdee1f9d9ab84ebf066562caaa682fe8fbdf3b6e:CHANGELOG.md:aws-access-token:50",
  "755605b1b01d51e270cf751d6804c9c64120f436:CHANGELOG.md:aws-access-token:104",
  # lumi/frontend test fixtures (AWS example key)
  "755605b1b01d51e270cf751d6804c9c64120f436:lumi/frontend/src/__tests__/sigv4WebSocket.test.ts:aws-access-token:19",
  "755605b1b01d51e270cf751d6804c9c64120f436:lumi/frontend/src/__tests__/sigv4WebSocket.test.ts:aws-access-token:82",
  "755605b1b01d51e270cf751d6804c9c64120f436:lumi/frontend/src/__tests__/useVoiceAgent.test.ts:aws-access-token:38",
  # Stale top-level frontend/ paths (pre-monorepo restructure baseline)
  "743158c0ae0ab324a8dd6100bf02606626270a87:frontend/src/__tests__/sigv4WebSocket.test.ts:aws-access-token:19",
  "743158c0ae0ab324a8dd6100bf02606626270a87:frontend/src/__tests__/sigv4WebSocket.test.ts:aws-access-token:82",
  "743158c0ae0ab324a8dd6100bf02606626270a87:frontend/src/__tests__/useVoiceAgent.test.ts:aws-access-token:30",
  # frontend/.env.production public NEXT_PUBLIC_* config (two fingerprints)
  "88658dfcba880e1a0f32625240c5823e4b4ddb7f:frontend/.env.production:generic-api-key:3",
  "451397dfe9e29e2f74d6b2e2606c9612cd5f155e:frontend/.env.production:generic-api-key:3",
]
